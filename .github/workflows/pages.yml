# Deploys the frontend to GitHub Pages from the default branch only.
# This does not run on pull requests. After this workflow is merged to main:
#   1. In the repo Settings → Pages, set Source to "GitHub Actions".
#   2. The site will be at https://starknet-innovation.github.io/kamui-demo/
#      (the repo is currently internal, so only org members will see it unless
#      the repo is made public).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: GITHUB_PAGES=1 bun run build
      # SPA fallback so /keychain/connect is served by index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
